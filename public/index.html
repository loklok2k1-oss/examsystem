<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考試系統</title>
<style>
:root { --bg:#f2f4f7; --card:#ffffff; --text:#1a2332; --muted:#667085; --line:#d9dee6; --accent:#1e3a5f; --accent2:#2f6db3; --good:#177245; --bad:#b42318; --chip:#e8edf3; }
[data-theme="dark"] { --bg:#14181f; --card:#1e2530; --text:#e8ecf1; --muted:#9aa7b8; --line:#334052; --accent:#7fb0e8; --accent2:#7fb0e8; --good:#4ade80; --bad:#f87171; --chip:#2a3444; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system, "PingFang HK", "Microsoft JhengHei", sans-serif; background:var(--bg); color:var(--text); }
header.top { background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px; position:sticky; top:0; z-index:20; }
header.top .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
header.top h1 { font-size:20px; margin:0; }
header.top .who { color:var(--muted); font-size:14px; }
header.top .spacer { flex:1; }
button { cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:8px 14px; font-size:15px; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.danger { color:var(--bad); border-color:var(--bad); }
button:disabled { opacity:.5; cursor:not-allowed; }
nav.tabs { display:flex; flex-wrap:wrap; gap:8px; padding:10px 16px 0; }
nav.tabs button { border-radius:999px; background:var(--chip); border:1px solid var(--line); }
nav.tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
main { max-width:960px; margin:0 auto; padding:16px; padding-bottom:120px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
.card h2 { margin:0 0 12px; font-size:19px; }
.card h3 { margin:16px 0 8px; font-size:16px; }
.muted { color:var(--muted); font-size:14px; }
.grid4 { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
.stat .k { color:var(--muted); font-size:14px; }
.stat .v { font-size:30px; font-weight:700; }
input, select, textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); font-size:15px; margin:4px 0 10px; }
label { font-size:14px; color:var(--muted); display:block; }
textarea { min-height:80px; resize:vertical; }
.opt { display:block; width:100%; text-align:left; margin:6px 0; padding:11px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); font-size:16px; }
.opt.sel { border-color:var(--accent2); outline:2px solid var(--accent2); }
.opt.right { border-color:var(--good); background:rgba(23,114,69,.12); }
.opt.wrong { border-color:var(--bad); background:rgba(180,35,24,.10); }
.explain { border:1px dashed var(--line); border-radius:10px; padding:10px; margin-top:10px; background:var(--chip); }
.explain summary { cursor:pointer; font-weight:700; }
.bar-row { margin:8px 0; }
.bar-row .lbl { display:flex; justify-content:space-between; font-size:14px; }
.bar { height:14px; background:var(--chip); border-radius:999px; overflow:hidden; margin-top:4px; }
.bar > div { height:100%; background:var(--good); }
.bar.blue > div { background:var(--accent); }
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { border-bottom:1px solid var(--line); padding:8px 6px; text-align:left; vertical-align:top; }
.qnav { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
.qnav button { width:40px; height:40px; padding:0; border-radius:8px; }
.qnav button.done { background:var(--good); color:#fff; border-color:var(--good); }
.qnav button.marked { border-color:#b7791f; outline:2px solid #b7791f; }
.qnav button.cur { outline:2px solid var(--accent2); }
.statusbar { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); padding:10px 16px; display:flex; gap:16px; flex-wrap:wrap; align-items:center; z-index:30; font-size:14px; }
.statusbar .spacer { flex:1; }
.modal-back { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
.modal { background:var(--card); border-radius:12px; padding:20px; max-width:560px; width:100%; max-height:85vh; overflow:auto; }
.errbox { max-width:560px; margin:80px auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; text-align:center; }
.errbox h2 { margin-top:0; }
.pill { display:inline-block; background:var(--chip); border-radius:999px; padding:2px 10px; font-size:13px; margin-right:6px; }
@media (max-width:600px) { .grid4 { grid-template-columns:1fr 1fr; } main { padding:12px; padding-bottom:140px; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="/app.js"></script>
</body>
</html>
